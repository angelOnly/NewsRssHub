<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="个人化每日情报台：从可信来源中筛选真正重要的更新。">
    <meta name="theme-color" content="#173c2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NewsRSSHub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>{% block title %}NewsRSSHub{% endblock %}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/newsrsshub-icon.svg">
    <link rel="stylesheet" href="/static/app.css?v=20260804-mobiletopnav5">
    <link rel="stylesheet" href="/static/x-session.css?v=20260804-push4">
    <script src="/static/scroll-restore.js?v=20260804-2" defer></script>
    <script src="/static/read-state.js?v=20260804-1" defer></script>
    <script src="/static/push-client.js?v=20260804-push2" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="返回情报首页">
          <span class="brand-mark">N</span>
        </a>
        <p class="brand-note">你的每日信号台</p>
        <nav class="nav" aria-label="主导航">
          <a class="nav-link {% if active_path == '/' %}active{% endif %}" href="/">
            <span>⌁</span> 最新热点
          </a>
          <a class="nav-link {% if active_path.startswith('/saved') %}active{% endif %}" href="/saved">
            <span>☆</span> 收藏
          </a>
          <a class="nav-link {% if active_path.startswith('/briefs') %}active{% endif %}" href="/briefs">
            <span>▤</span> 每日简报
          </a>
          <a class="nav-link {% if active_path.startswith('/sources') %}active{% endif %}" href="/sources">
            <span>◎</span> 来源管理
          </a>
          <a class="nav-link {% if active_path.startswith('/settings') or active_path.startswith('/connections') %}active{% endif %}" href="/settings">
            <span>✦</span> 设置与连接
          </a>
        </nav>
        <div class="sidebar-foot">
          <span class="pulse-dot"></span>
          后台会按全局策略自动更新
        </div>
        <nav class="mobile-primary-nav" aria-label="主导航">
          <a class="nav-link {% if active_path == '/' %}active{% endif %}" href="/" {% if active_path == '/' %}aria-current="page"{% endif %}>热点</a>
          <a class="nav-link {% if active_path.startswith('/saved') %}active{% endif %}" href="/saved" {% if active_path.startswith('/saved') %}aria-current="page"{% endif %}>收藏</a>
          <a class="nav-link {% if active_path.startswith('/briefs') %}active{% endif %}" href="/briefs" {% if active_path.startswith('/briefs') %}aria-current="page"{% endif %}>简报</a>
          <a class="nav-link {% if active_path.startswith('/sources') %}active{% endif %}" href="/sources" {% if active_path.startswith('/sources') %}aria-current="page"{% endif %}>来源</a>
          <a class="nav-link {% if active_path.startswith('/settings') or active_path.startswith('/connections') %}active{% endif %}" href="/settings" {% if active_path.startswith('/settings') or active_path.startswith('/connections') %}aria-current="page"{% endif %}>设置</a>
        </nav>
      </aside>
      <main class="content">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
