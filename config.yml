# config.yml
app:
  source_dir: "sources"      # RSS源配置文件所在的文件夹
  log_level: "INFO"
  request_timeout: 30
  # Web Push 的 VAPID 发件人标识；HTTPS 格式不带端口，或改用有效的 mailto: 地址。
  web_push_subject: "https://news-rss.xiaolicloud.cn"
  # X、Reddit、YouTube 与通用 RSS 均通过你已部署的自定义 RSSHub 抓取。
  rsshub_base_url: "https://rsshub.xiaolicloud.cn:18443"

# ===============================================================
# SQLite 持久化
# ===============================================================
database:
  type: "sqlite"
  path: "rss_news.db"  # SQLite 统一文件路径


