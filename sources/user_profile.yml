# ============================================
# 📌 用户兴趣画像 — 控制每日复盘的内容筛选与打分
# 修改此文件后，下次复盘自动生效，无需改代码
# ============================================

# ------------------------------------------
# 身份标签（供 LLM 理解你是谁）
# ------------------------------------------
identity:
  role: "AI算法工程师 / AI产品从业者"
  description: |
    我是一名AI从业者和算法工程师，关注AI产品与行业前沿动态。
    自学ComfyUI，尤其关注ComfyUI制作视频方面的新技术、新插件、新模型和新工作流。以资讯为主，一些需要详细学习的不要分析，我只关注前沿新技术资讯相关。
    关注国际局势，用来预判未来经济走势和国家动态。
    关注国内重大事件和全网爆火热点。
    理财方面关注黄金、科技股、行业动态(原油、电气、特斯拉、Google、英伟达等)。
    关注科技产品的新发布和新动态。
    关注商业洞察，包括新闻中的商业分析和博主分享的对未来趋势的判断。

# ------------------------------------------
# 兴趣维度 — 每个维度有权重(1-10)和关键词
# weight 越高 → 复盘中该维度的内容越优先展示
# keywords 用于标题/内容匹配打分
# ------------------------------------------
interests:
  - name: "🤖 AI产品与行业前沿"
    weight: 10
  - name: "🎬 ComfyUI与AI视频制作"
    weight: 9
  - name: "🌍 国际局势与地缘政治"
    weight: 9
  - name: "🔥 国内重大事件与全网热点"
    weight: 8
  - name: "💰 理财与市场动态"
    weight: 8
  - name: "📱 科技新品与发布"
    weight: 6
  - name: "💡 商业洞察与趋势判断"
    weight: 10
# ------------------------------------------
# 评分规则
# ------------------------------------------
scoring:
  # 标题命中关键词的基础得分
  # 多个兴趣维度同时命中的加分 (每多命中一个维度 +N 分)
  multi_dimension_bonus: 2
  # 高权重维度的额外乘数 (weight >= 8 时生效)
  high_weight_multiplier: 1.5
  # 最低展示分数阈值 (低于此分数的内容不进入复盘)
  min_display_score: 2
  # 视频内容的天然加分 (因为你专门订阅了B站UP主)
  video_bonus: 2

# ------------------------------------------
# 过滤黑名单 — 直接跳过包含这些词的内容
# ------------------------------------------
blacklist:
  - "明星"
  - "娱乐八卦"
  - "饭圈"
  - "综艺"
  - "选秀"
  - "球赛"
  - "体育赛事"
  - "追星"
  - "偶像"
  - "真人秀"
