services:
  web:
    build: .
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
    ports:
      - "8188:8000"
    volumes:
      - /home/jzb/docker/rss-hub/data:/app/data
      - /home/jzb/docker/rss-hub/sources:/app/sources:ro
      - /home/jzb/docker/rss-hub/config.yml:/app/config.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: python -m app.worker --interval 60
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
    volumes:
      - /home/jzb/docker/rss-hub/data:/app/data
      - /home/jzb/docker/rss-hub/sources:/app/sources:ro
      - /home/jzb/docker/rss-hub/config.yml:/app/config.yml:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
