services:
  web:
    build: .
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    ports:
      - "8188:8000"
    volumes:
      - /home/jzb/docker/rss-hub/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: python -m app.worker --interval 60
    volumes:
      - /home/jzb/docker/rss-hub/data:/app/data
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # 仅在手工执行数据库预检/迁移时启动。它不会随 `docker compose up -d`
  # 自动运行，避免服务启动过程中重建已经在使用的 SQLite 数据库。
  migrate:
    build: .
    # 用 entrypoint 保证 `docker compose run migrate --check/--apply` 中的
    # 参数会传给迁移程序，而不是覆盖整条 Python 命令。
    entrypoint: ["python", "-m", "app.migrate"]
    command: ["--check"]
    volumes:
      - /home/jzb/docker/rss-hub/data:/app/data
    profiles: ["maintenance"]
    restart: "no"
